<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>دفتر الحصص</title>
<meta name="description" content="جدول مدرسي وجدول دروس خصوصية يعمل بدون إنترنت">
<meta name="theme-color" content="#22402E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر الحصص">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EAD8;
    --paper-dim:#E9DDBC;
    --line:#CBB88C;
    --board:#22402E;
    --board-deep:#152A1E;
    --chalk:#F5EFDD;
    --ink:#2B2318;
    --ink-soft:#6b5f49;
    --brass:#B4863B;
    --red:#A3402F;
    --blue:#2F5A78;
    --purple:#6B4A73;
    --green2:#4C7A4E;
    --teal:#2F6B63;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;overflow-x:hidden;width:100%;}
  *{
    -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  input, textarea{
    -webkit-user-select:text; -moz-user-select:text; -ms-user-select:text; user-select:text;
    -webkit-touch-callout:default;
  }
  img{-webkit-user-drag:none; user-drag:none;}
  body{
    background:
      linear-gradient(var(--paper-dim),var(--paper-dim)) fixed,
      repeating-linear-gradient(0deg, transparent 0 27px, var(--line) 27px 28px) fixed;
    background-blend-mode:normal;
    background-color:var(--paper);
    font-family:'Tajawal',sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  .app{max-width:430px;margin:0 auto;padding:0 0 28px;overflow-x:hidden;}

  /* ---- header ---- */
  header.board{
    background:linear-gradient(180deg,var(--board),var(--board-deep));
    color:var(--chalk);
    padding:20px 16px 16px;
    border-bottom:6px solid var(--brass);
    position:relative;
    overflow:hidden;
  }
  header.board::after{
    content:"";
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(245,239,221,.05) 1px, transparent 1px);
    background-size:9px 9px;
    pointer-events:none;
  }
  header.board h1{
    font-family:'Cairo',sans-serif; font-weight:800;
    margin:0; font-size:22px; letter-spacing:.5px;
  }
  header.board p{margin:4px 0 0; font-size:12px; color:#cdd8c9; opacity:.85;}

  /* ---- segmented mode switch ---- */
  .controls{padding:14px 14px 0;}
  .segmented{
    display:flex; background:var(--paper-dim); border:1.5px solid var(--line);
    border-radius:12px; padding:3px; gap:3px;
  }
  .segmented button{
    flex:1; border:none; background:transparent; padding:9px 4px;
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:13.5px;
    color:var(--ink-soft); border-radius:9px; cursor:pointer;
  }
  .segmented button.active{
    background:var(--board); color:var(--chalk);
    box-shadow:0 2px 0 var(--board-deep);
  }

  .toolbar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-top:10px;
  }
  .pill-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--paper); border:1.5px solid var(--line);
    border-radius:20px; padding:7px 12px; font-size:12.5px; font-weight:700;
    color:var(--ink); cursor:pointer; user-select:none;
  }
  .pill-btn.on{background:var(--board); color:var(--chalk); border-color:var(--board-deep);}
  .pill-btn svg{width:14px;height:14px;flex:none;}

  .stepper{
    display:flex; align-items:center; gap:0; background:var(--paper);
    border:1.5px solid var(--line); border-radius:20px; overflow:hidden;
  }
  .stepper button{
    border:none; background:transparent; width:30px; height:30px;
    font-size:16px; font-weight:800; color:var(--board); cursor:pointer;
  }
  .stepper span{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px;
    min-width:34px; text-align:center;
  }

  .clear-all{
    margin-inline-start:auto; font-size:11.5px; color:var(--red);
    background:none; border:none; text-decoration:underline; font-weight:700;
    cursor:pointer; font-family:'Tajawal',sans-serif; padding:4px;
  }

  .day-chips{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .day-chip{
    padding:6px 12px; border-radius:14px; border:1.5px solid var(--line);
    background:var(--paper); font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .day-chip.active{background:var(--brass); color:var(--chalk); border-color:#8f6a2c;}

  /* ---- tray ---- */
  .tray-label{
    font-size:11px; color:var(--ink-soft); margin:16px 14px 6px; font-weight:700;
    display:flex; align-items:center; gap:6px;
  }
  .tray-label .dash{flex:1; height:1px; background:var(--line);}
  .tray{
    display:flex; flex-wrap:wrap; gap:9px; padding:0 14px;
  }
  .stamp-chip{
    position:relative;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:13px;
    padding:8px 12px;
    border-radius:9px;
    border:2px solid var(--c, var(--brass));
    color:var(--c, var(--brass));
    background:
      repeating-linear-gradient(45deg, transparent 0 2px, rgba(0,0,0,.02) 2px 4px),
      var(--paper);
    cursor:pointer; user-select:none;
    box-shadow:0 1px 0 rgba(0,0,0,.08);
  }
  .stamp-chip.selected{background:var(--c, var(--brass)); color:var(--chalk);}
  .stamp-chip .rm{
    position:absolute; top:-7px; left:-7px; width:18px; height:18px;
    background:var(--red); color:#fff; border-radius:50%; font-size:11px;
    display:flex; align-items:center; justify-content:center; font-weight:900;
    border:2px solid var(--paper);
  }
  .add-chip{
    border:2px dashed var(--line); color:var(--ink-soft); background:transparent;
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:13px;
    border-radius:9px; padding:8px 14px; cursor:pointer;
  }
  .add-form{
    display:flex; gap:6px; padding:8px 14px 0; width:100%;
  }
  .add-form input{
    flex:1; min-width:0; border:1.5px solid var(--line); border-radius:8px;
    padding:8px 10px; font-family:'Tajawal',sans-serif; font-size:13px; background:#fff;
  }
  .add-form button{
    border:none; border-radius:8px; padding:0 14px; font-weight:800;
    background:var(--board); color:var(--chalk); font-size:13px; cursor:pointer;
  }

  .hint{font-size:11px; color:var(--ink-soft); padding:10px 14px 0; line-height:1.7;}

  /* ---- grid ---- */
  .grid-wrap{padding:14px;}
  .lock-bar{padding:12px 14px 0;}
  .lock-btn-main{
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--paper); border:2px solid var(--line); border-radius:14px;
    padding:11px; font-family:'Tajawal',sans-serif; font-weight:800; font-size:14px;
    color:var(--board); cursor:pointer;
  }
  .lock-btn-main.on{
    background:var(--red); border-color:#7c2e21; color:var(--chalk);
  }
  .lock-btn-main svg{width:18px; height:18px; flex:none;}
  table{width:100%; table-layout:fixed; border-collapse:separate; border-spacing:3px;}
  col.day-col{width:23%;}
  thead th{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--ink-soft);
    font-weight:600; padding-bottom:4px; text-align:center;
  }
  thead th.day-head{visibility:hidden;}
  tbody td.day-cell{
    font-family:'Cairo',sans-serif; font-weight:800; font-size:9.5px;
    color:var(--chalk); background:var(--board);
    border-radius:8px; text-align:center; vertical-align:middle;
    height:38px; line-height:1.1; padding:0 2px; overflow:hidden;
    white-space:nowrap;
  }
  tbody td.slot{padding:0; height:38px; vertical-align:middle;}
  .cell-inner{
    width:100%; height:38px; border-radius:7px;
    border:1.5px dashed var(--line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; background:rgba(255,255,255,.35);
  }
  .cell-inner.filled{
    border:2px solid var(--c, var(--brass));
    color:var(--c, var(--brass));
    background:var(--paper);
    font-family:'Cairo',sans-serif; font-weight:800;
  }
  .cell-inner span{font-size:9px; line-height:1; white-space:nowrap;}
  .cell-inner[data-len="3"] span{font-size:8.5px;}
  .cell-inner[data-len="4"] span, .cell-inner[data-len="5"] span, .cell-inner[data-len="6"] span{font-size:7px;}
  .locked .cell-inner{cursor:default;}

  @keyframes stampIn{
    0%{transform:scale(1.55) rotate(var(--rot,-4deg)); opacity:0;}
    60%{transform:scale(0.92) rotate(var(--rot,-4deg)); opacity:1;}
    100%{transform:scale(1) rotate(var(--rot,-4deg)); opacity:1;}
  }
  .cell-inner.filled.pop{animation:stampIn .28s ease-out;}
  @keyframes clearFlash{
    0%{background:var(--red); border-color:var(--red);}
    100%{background:rgba(255,255,255,.35); border-color:var(--line);}
  }
  .cell-inner.clear-flash{animation:clearFlash .3s ease-out;}

  /* ---- day-only view ---- */
  .day-list{padding:4px 14px 0; display:flex; flex-direction:column; gap:9px;}
  .day-row{
    display:flex; align-items:center; gap:10px;
    background:var(--paper); border:1.5px solid var(--line); border-radius:12px;
    padding:8px 10px;
  }
  .day-row .num{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11px;
    color:var(--ink-soft); width:30px; text-align:center; flex:none;
  }
  .day-row .day-slot{flex:1; min-width:0;}
  .day-row .day-slot .cell-inner{height:44px; border-radius:9px;}
  .day-row .day-slot .cell-inner span{font-size:13px;}

  footer{text-align:center; font-size:10.5px; color:var(--ink-soft); padding:22px 14px 0;}
  footer b{color:var(--board);}
</style>
</head>
<body>
<div class="app">
  <header class="board">
    <h1>📋 دفتر الحصص</h1>
    <p>جدول المدرسة وجدول الدروس الخصوصية — في مكان واحد</p>
  </header>

  <div class="lock-bar">
    <button class="lock-btn-main" id="lockBtn"></button>
  </div>

  <div class="grid-wrap" id="gridWrap"></div>
  <div class="day-list" id="dayList" style="display:none;"></div>

  <div class="controls">
    <div class="segmented" id="modeSwitch">
      <button data-mode="school">جدول مدرسي</button>
      <button data-mode="lessons">جدول دروس</button>
    </div>

    <div class="toolbar" id="toolbar">
      <button class="pill-btn" id="dayOnlyBtn">📅 اليوم فقط</button>
      <div class="stepper" id="periodStepper">
        <button data-d="-1">−</button>
        <span id="periodCountLabel">٧</span>
        <button data-d="1">+</button>
      </div>
      <button class="pill-btn" id="satBtn">السبت</button>
    </div>
    <div class="toolbar" id="backupBar">
      <button class="pill-btn" id="exportBtn">⬇️ نسخة احتياطية</button>
      <button class="pill-btn" id="importBtn">⬆️ استرجاع نسخة</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
      <button class="clear-all" id="clearAllBtn">مسح الجدول</button>
    </div>

    <div class="day-chips" id="dayChips" style="display:none;"></div>
  </div>

  <div class="tray-label"><span id="trayTitle">الفصول</span><span class="dash"></span></div>
  <div class="tray" id="tray"></div>

  <div class="hint">اضغط على الخانة لتدوير البطاقات، واضغط مطوّلًا لمسحها.</div>

  <footer>صُمم لـ<b> محمود</b> — دفتر حصص رقمي بروح دفاتر الفصل، يعمل بالكامل بدون إنترنت 📴</footer>
</div>

<script>
(function(){
  // منع النسخ والتحديد وقائمة النقر بزر الفأرة الأيمن في كل الصفحة (ما عدا حقول الإدخال)
  const allowIn = (el) => el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA');
  document.addEventListener('contextmenu', (e)=>{ if(!allowIn(e.target)) e.preventDefault(); });
  document.addEventListener('selectstart', (e)=>{ if(!allowIn(e.target)) e.preventDefault(); });
  document.addEventListener('copy', (e)=>{ if(!allowIn(e.target)) e.preventDefault(); });
  document.addEventListener('cut', (e)=>{ if(!allowIn(e.target)) e.preventDefault(); });
  document.addEventListener('dragstart', (e)=>{ if(!allowIn(e.target)) e.preventDefault(); });

  const AR_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  const toAr = n => String(n).split('').map(c => /[0-9]/.test(c) ? AR_DIGITS[c] : c).join('');

  const ALL_DAYS = {
    sat:{label:'السبت', short:'س'},
    sun:{label:'الأحد', short:'ح'},
    mon:{label:'الاثنين', short:'ن'},
    tue:{label:'الثلاثاء', short:'ث'},
    wed:{label:'الأربعاء', short:'ر'},
    thu:{label:'الخميس', short:'خ'},
    fri:{label:'الجمعة', short:'ج'}
  };
  const SCHOOL_DAY_IDS_FULL = ['sat','sun','mon','tue','wed','thu'];
  const LESSON_DAY_IDS = ['sat','sun','mon','tue','wed','thu','fri'];
  const PALETTE = ['var(--brass)','var(--red)','var(--blue)','var(--purple)','var(--green2)','var(--teal)'];
  const MAX_PERIODS = 8;
  const LESSON_TIMES = ['٢-٣','٣-٤','٤-٥','٥-٦','٦-٧'];

  let state = {
    mode:'school',
    periodCount:7,
    locked:false,
    dayOnly:false,
    selectedDay:'sat',
    saturdayEnabled:true,
    schoolCards:[
      {id:'c1', label:'١ث/أ'},
      {id:'c2', label:'١ث/ب'},
      {id:'c3', label:'٢ث/أ'},
      {id:'c4', label:'٢ث/ب'}
    ],
    lessonCards:[
      {id:'l1', label:'٤ب'},
      {id:'l2', label:'٥ب'},
      {id:'l3', label:'٦ب'},
      {id:'l4', label:'١ع'},
      {id:'l5', label:'٤ب خاص'},
      {id:'l6', label:'٥ب خاص'}
    ],
    gridSchool:{},   // key: day_col -> cardId
    gridLessons:{}   // key: day_col -> cardId
  };

  let addingCard = false;
  const STORAGE_KEY = 'jadwal-hisas-state-v1';

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const saved = JSON.parse(raw);
        state = Object.assign(state, saved);
      }
    }catch(e){ /* no saved state yet, or storage unavailable */ }
    // ask the browser to keep this data as long as possible (not auto-cleared under storage pressure)
    if(navigator.storage && navigator.storage.persist){
      navigator.storage.persist().catch(()=>{});
    }
    renderAll();
  }
  let saveTimer=null;
  function saveState(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      catch(e){ console.error('save failed', e); }
    }, 200);
  }

  function exportBackup(){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = 'نسخة-احتياطية-دفتر-الحصص-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }

  function importBackup(file){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const parsed = JSON.parse(e.target.result);
        if(!parsed || typeof parsed !== 'object') throw new Error('bad file');
        state = Object.assign({}, state, parsed);
        saveState();
        renderAll();
        alert('تم استرجاع النسخة الاحتياطية بنجاح.');
      }catch(err){
        alert('تعذّر قراءة الملف. تأكد أنه نسخة احتياطية صحيحة من دفتر الحصص.');
      }
    };
    reader.readAsText(file);
  }

  function currentDayIds(){
    if(state.mode==='school'){
      return state.saturdayEnabled ? SCHOOL_DAY_IDS_FULL : SCHOOL_DAY_IDS_FULL.filter(id=>id!=='sat');
    }
    return LESSON_DAY_IDS;
  }
  function currentCards(){ return state.mode==='school' ? state.schoolCards : state.lessonCards; }
  function currentGrid(){ return state.mode==='school' ? state.gridSchool : state.gridLessons; }
  function colCount(){ return state.mode==='school' ? state.periodCount : LESSON_TIMES.length; }
  function cardColor(idx){ return PALETTE[idx % PALETTE.length]; }
  function cardById(id){ return currentCards().find(c=>c.id===id); }
  function cardIndex(id){ return currentCards().findIndex(c=>c.id===id); }

  function renderAll(){
    renderModeSwitch();
    renderToolbar();
    renderDayChips();
    renderTray();
    renderGridOrDayList();
  }

  function renderModeSwitch(){
    document.querySelectorAll('#modeSwitch button').forEach(b=>{
      b.classList.toggle('active', b.dataset.mode===state.mode);
    });
    document.getElementById('trayTitle').textContent = state.mode==='school' ? 'الفصول' : 'بطاقات الدروس';
    document.getElementById('periodStepper').style.display = state.mode==='school' ? 'flex' : 'none';
    const satBtn = document.getElementById('satBtn');
    satBtn.style.display = state.mode==='school' ? 'flex' : 'none';
    satBtn.classList.toggle('on', state.saturdayEnabled);
    satBtn.textContent = state.saturdayEnabled ? 'السبت مفعّل' : 'السبت معطّل';
  }

  function lockSvg(locked){
    return locked
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>';
  }

  function renderToolbar(){
    const lockBtn = document.getElementById('lockBtn');
    lockBtn.innerHTML = lockSvg(state.locked) + '<span>' + (state.locked?'الجدول مقفول — اضغط للسماح بالتعديل':'قابل للتعديل — اضغط للقفل') + '</span>';
    lockBtn.classList.toggle('on', state.locked);

    const dayBtn = document.getElementById('dayOnlyBtn');
    dayBtn.classList.toggle('on', state.dayOnly);

    document.getElementById('periodCountLabel').textContent = toAr(state.periodCount);
    document.getElementById('gridWrap').classList.toggle('locked', state.locked);
    document.getElementById('dayList').classList.toggle('locked', state.locked);
  }

  function renderDayChips(){
    const wrap = document.getElementById('dayChips');
    wrap.style.display = state.dayOnly ? 'flex' : 'none';
    wrap.innerHTML = '';
    const ids = currentDayIds();
    if(!ids.includes(state.selectedDay)) state.selectedDay = ids[0];
    ids.forEach(id=>{
      const chip = document.createElement('div');
      chip.className = 'day-chip' + (state.selectedDay===id?' active':'');
      chip.textContent = ALL_DAYS[id].label;
      chip.onclick = ()=>{ state.selectedDay=id; saveState(); renderDayChips(); renderGridOrDayList(); };
      wrap.appendChild(chip);
    });
  }

  function renderTray(){
    const tray = document.getElementById('tray');
    tray.innerHTML = '';
    currentCards().forEach((c,i)=>{
      const chip = document.createElement('div');
      chip.className = 'stamp-chip';
      chip.style.setProperty('--c', cardColor(i));
      chip.innerHTML = '<span>'+escapeHtml(c.label)+'</span>';
      if(!state.locked){
        const rm = document.createElement('div');
        rm.className='rm'; rm.textContent='×';
        rm.onclick = (e)=>{ e.stopPropagation(); removeCard(c.id); };
        chip.appendChild(rm);
      }
      tray.appendChild(chip);
    });
    if(!state.locked){
      if(addingCard){
        const form = document.createElement('div');
        form.className='add-form';
        form.innerHTML = '<input id="newCardInput" maxlength="8" placeholder="مثال: ٣ث/أ" /><button id="newCardConfirm">إضافة</button>';
        tray.appendChild(form);
        setTimeout(()=>{
          const inp = document.getElementById('newCardInput');
          inp.focus();
          document.getElementById('newCardConfirm').onclick = ()=>confirmAddCard(inp.value);
          inp.onkeydown = (e)=>{ if(e.key==='Enter') confirmAddCard(inp.value); };
        },0);
      } else {
        const add = document.createElement('div');
        add.className='add-chip'; add.textContent='+ إضافة بطاقة';
        add.onclick = ()=>{ addingCard=true; renderTray(); };
        tray.appendChild(add);
      }
    }
  }

  function confirmAddCard(val){
    val = (val||'').trim();
    if(val){
      const list = currentCards();
      const id = (state.mode==='school'?'c':'l') + Date.now();
      list.push({id, label: val});
      saveState();
    }
    addingCard=false;
    renderTray();
  }

  function removeCard(id){
    if(state.mode==='school'){
      state.schoolCards = state.schoolCards.filter(c=>c.id!==id);
      Object.keys(state.gridSchool).forEach(k=>{ if(state.gridSchool[k]===id) delete state.gridSchool[k]; });
    } else {
      state.lessonCards = state.lessonCards.filter(c=>c.id!==id);
      Object.keys(state.gridLessons).forEach(k=>{ if(state.gridLessons[k]===id) delete state.gridLessons[k]; });
    }
    saveState();
    renderTray();
    renderGridOrDayList();
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function cycleCell(day, col){
    if(state.locked) return;
    const grid = currentGrid();
    const key = day+'_'+col;
    const cards = currentCards();
    if(cards.length===0) return;
    const curId = grid[key];
    const idx = curId ? cards.findIndex(c=>c.id===curId) : -1;
    const nextIdx = idx+1;
    if(nextIdx >= cards.length){ delete grid[key]; }
    else { grid[key] = cards[nextIdx].id; }
    saveState();
    renderGridOrDayList();
  }

  function clearCell(day, col){
    if(state.locked) return;
    const grid = currentGrid();
    const key = day+'_'+col;
    if(grid[key]){ delete grid[key]; saveState(); renderGridOrDayList(); }
  }

  function makeCellInner(day, col, dayList){
    const grid = currentGrid();
    const key = day+'_'+col;
    const id = grid[key];
    const inner = document.createElement('div');
    inner.className = 'cell-inner';
    if(id){
      const idx = cardIndex(id);
      const card = cardById(id);
      if(card){
        inner.classList.add('filled');
        inner.style.setProperty('--c', cardColor(idx));
        inner.style.setProperty('--rot', (idx%2===0?'-3deg':'2.5deg'));
        inner.setAttribute('data-len', String(card.label.replace(/\s/g,'').length));
        const span = document.createElement('span');
        span.textContent = card.label;
        inner.appendChild(span);
      }
    }
    let pressTimer=null, longPressed=false;
    inner.addEventListener('pointerdown', (e)=>{
      longPressed=false;
      pressTimer = setTimeout(()=>{
        longPressed=true;
        inner.classList.add('clear-flash');
        clearCell(day, col);
      }, 520);
    });
    const cancelPress = ()=>{ clearTimeout(pressTimer); };
    inner.addEventListener('pointerup', ()=>{
      cancelPress();
      if(!longPressed){
        cycleCell(day, col);
        requestAnimationFrame(()=>{
          const el = document.querySelector(dayList
            ? '.day-row[data-day="'+day+'"] .cell-inner'
            : '[data-day="'+day+'"][data-col="'+col+'"] .cell-inner');
        });
      }
    });
    inner.addEventListener('pointerleave', cancelPress);
    inner.addEventListener('pointercancel', cancelPress);
    return inner;
  }

  function renderGridOrDayList(){
    if(state.dayOnly){
      document.getElementById('gridWrap').style.display='none';
      document.getElementById('dayList').style.display='flex';
      renderDayList();
    } else {
      document.getElementById('gridWrap').style.display='block';
      document.getElementById('dayList').style.display='none';
      renderGrid();
    }
  }

  function headerLabel(col){
    return state.mode==='school' ? toAr(col+1) : LESSON_TIMES[col];
  }

  function renderGrid(){
    const wrap = document.getElementById('gridWrap');
    wrap.innerHTML='';
    const table = document.createElement('table');
    const cols = colCount();

    const colgroup = document.createElement('colgroup');
    const dayCol = document.createElement('col'); dayCol.className='day-col';
    colgroup.appendChild(dayCol);
    for(let i=0;i<cols;i++) colgroup.appendChild(document.createElement('col'));
    table.appendChild(colgroup);

    const thead = document.createElement('thead');
    const trh = document.createElement('tr');
    const thDay = document.createElement('th'); thDay.className='day-head'; thDay.textContent='يوم';
    trh.appendChild(thDay);
    for(let c=0;c<cols;c++){
      const th = document.createElement('th');
      th.textContent = headerLabel(c);
      trh.appendChild(th);
    }
    thead.appendChild(trh);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    currentDayIds().forEach(dayId=>{
      const d = ALL_DAYS[dayId];
      const tr = document.createElement('tr');
      const tdDay = document.createElement('td');
      tdDay.className='day-cell';
      tdDay.textContent = d.label;
      tdDay.title = d.label;
      tr.appendChild(tdDay);
      for(let col=0; col<cols; col++){
        const td = document.createElement('td');
        td.className='slot';
        td.setAttribute('data-day', dayId);
        td.setAttribute('data-col', col);
        td.appendChild(makeCellInner(dayId, col, false));
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
  }

  function renderDayList(){
    const wrap = document.getElementById('dayList');
    wrap.innerHTML='';
    const cols = colCount();
    const day = state.selectedDay;
    for(let col=0; col<cols; col++){
      const row = document.createElement('div');
      row.className='day-row';
      row.setAttribute('data-day', day);
      const num = document.createElement('div');
      num.className='num';
      num.textContent = headerLabel(col);
      row.appendChild(num);
      const slot = document.createElement('div');
      slot.className='day-slot';
      slot.appendChild(makeCellInner(day, col, true));
      row.appendChild(slot);
      wrap.appendChild(row);
    }
  }

  // ---- events ----
  document.getElementById('modeSwitch').addEventListener('click',(e)=>{
    const btn = e.target.closest('button[data-mode]');
    if(!btn) return;
    state.mode = btn.dataset.mode;
    addingCard=false;
    saveState();
    renderAll();
  });

  document.getElementById('lockBtn').addEventListener('click', ()=>{
    state.locked = !state.locked;
    saveState();
    renderToolbar();
    renderTray();
    renderGridOrDayList();
  });

  document.getElementById('dayOnlyBtn').addEventListener('click', ()=>{
    state.dayOnly = !state.dayOnly;
    saveState();
    renderToolbar();
    renderDayChips();
    renderGridOrDayList();
  });

  document.getElementById('satBtn').addEventListener('click', ()=>{
    if(state.locked) return;
    state.saturdayEnabled = !state.saturdayEnabled;
    saveState();
    renderAll();
  });

  document.getElementById('periodStepper').addEventListener('click',(e)=>{
    const btn = e.target.closest('button[data-d]');
    if(!btn || state.locked) return;
    const d = parseInt(btn.dataset.d,10);
    state.periodCount = Math.max(5, Math.min(MAX_PERIODS, state.periodCount + d));
    saveState();
    renderToolbar();
    renderGridOrDayList();
  });

  document.getElementById('exportBtn').addEventListener('click', exportBackup);
  document.getElementById('importBtn').addEventListener('click', ()=>{
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(file) importBackup(file);
    e.target.value = '';
  });

  document.getElementById('clearAllBtn').addEventListener('click', ()=>{
    if(state.locked) return;
    if(state.mode==='school') state.gridSchool = {};
    else state.gridLessons = {};
    saveState();
    renderGridOrDayList();
  });

  loadState();

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('service-worker.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
